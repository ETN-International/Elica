server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Header di sicurezza. NB: in nginx un `add_header` dentro una location
  # ANNULLA quelli ereditati, per questo sono ripetuti nel blocco /assets/.
  # `img-src data: blob:` serve agli allegati della chat e all'export del
  # dossier; `connect-src` deve elencare AlphaFold e il gateway del tutor.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://alphafold.ebi.ac.uk https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

  # Compressione
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Asset con hash nel nome: cache lunga e immutabile
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Ripetuti: l'add_header qui sopra azzererebbe quelli del blocco server.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  # SPA: qualsiasi rotta ricade su index.html (il routing è lato client)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html non va cachato (così i nuovi deploy si vedono subito)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
